<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Experiment 10 - Student Database</title>

    <link rel="stylesheet" href="exp10.css">

</head>

<body>

    <!-- <div class="student-name">
        Ashish Jaiswal
    </div> -->

    <div class="container">

        <h1>Experiment 10</h1>

        <h2>Student Name & Age Database</h2>

        <div class="card">

            <input
                type="text"
                id="name"
                placeholder="Enter name"
            >

            <input
                type="number"
                id="age"
                placeholder="Enter age"
            >

            <button onclick="insertData()">
                Insert Data
            </button>

            <button
                onclick="clearData()"
                class="delete"
            >
                Clear Table
            </button>

        </div>


        <div class="table-card">

            <h3>Current Table Contents</h3>

            <table>

                <thead>

                    <tr>

                        <th>S.No.</th>

                        <th>Name</th>

                        <th>Age</th>

                    </tr>

                </thead>

                <tbody id="studentTable">

                </tbody>

            </table>

        </div>

<!-- 
        <a href="../index.html" class="back">
            ← Back to Home
        </a> -->

    </div>

    <!-- <footer>

    </footer> -->

    <script src="exp10.js"></script>

</body>

</html>
