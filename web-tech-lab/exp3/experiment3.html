<body>

    <div class="container">

        <h1>Experiment 3</h1>

        <h2>JavaScript Functions</h2>

        <hr />

        <div class="box">

            <h3>Program 1</h3>

            <p>Find the Position of the Left-most Vowel</p>

            <input type="text" id="textInput" placeholder="Enter a string" />

            <br /><br />

            <input type="button" value="Find Vowel" onclick="findVowel()" />

            <p id="vowelResult"></p>

        </div>

        <div class="box">

            <h3>Program 2</h3>

            <p>Reverse a Number</p>

            <input type="text" id="numberInput" placeholder="Enter a number" />

            <br /><br />

            <input type="button" value="Reverse Number" onclick="reverseNumber()" />

            <p id="reverseResult"></p>

        </div>
